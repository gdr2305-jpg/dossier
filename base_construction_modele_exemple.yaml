# Exemple minimal de description d'un modèle
page:
  format: A5
  grid:
    step_mm: 5
    margins_mm:
      left: 8
      right: 8
      top: 8
      bottom: 8

background:
  dots:
    enabled: true

structure:
  vertical_solid_columns: [6, 9, 12, 15, 18]
  horizontal_solid_rows: [4, 6, 8, 10, 12]
  notes:
    vertical_rule: "trait - 2 colonnes de dots - trait"
    horizontal_rule: "ligne - 1 rangée de dots - ligne"

annotations:
  - kind: label
    text: "8h"
    column: 6
    row: 3
    align: center
  - kind: label
    text: "10h"
    column: 9
    row: 3
    align: center

usage:
  purpose: "Suivi mensuel"
  handwriting_space: true
